# Logitech's public product photo, downloaded once on first use and kept in
# ~/.local/share/lhub/devices/<model>/ (not shipped). crop = x, y, width, height of the mouse.
# "vivid" cutout: strongly colored pixels inside the LED regions (the lit strip) become
# openings that show the live zone colors.
[layout.photo]
url = "https://resource.logitechg.com/f_png,q_auto/content/dam/gaming/en/products/g502x-plus/2026-update/gallery/g502-x-plus-top-angle-black-gallery-1.png"
crop = [716, 198, 1046, 1761]
cutout = "vivid"

