name: Bug report
description: Something in GlowDen doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GlowDen version
      description: "`pacman -Q glowden` or `dpkg -s glowden | grep Version`"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop
      description: e.g. Arch, KDE Plasma 6, Wayland
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Devices
      description: Output of `glowdenctl list`
      render: text
  - type: textarea
    id: log
    attributes:
      label: Service log
      description: The last lines of `~/.local/state/glowden/glowdend.log` around the problem
      render: text
